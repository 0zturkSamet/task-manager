# =====================================================
# Render.com Deployment Configuration
# =====================================================
# This file configures automatic deployment of the
# Task Manager backend on Render's free tier.
# =====================================================

services:
  - type: web
    name: task-manager-backend
    runtime: java
    plan: free

    # Build Configuration
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/task-manager-backend-1.0.0.jar

    # Health Check Configuration
    healthCheckPath: /actuator/health

    # Environment Variables
    # Configure these in Render Dashboard: Settings > Environment
    envVars:
      # ===========================================
      # DATABASE CONFIGURATION (from Supabase)
      # ===========================================

      # APPLICATION DATABASE (pooler connection - port 6543)
      # Format: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:6543/postgres?prepareThreshold=0
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard

      # Pooler username format: postgres.PROJECT_REF
      - key: DATABASE_USERNAME
        sync: false  # Set manually in Render dashboard

      # Your Supabase database password
      - key: DATABASE_PASSWORD
        sync: false  # Set manually in Render dashboard

      # ===========================================
      # FLYWAY MIGRATION DATABASE (REQUIRED for Supabase!)
      # Flyway MUST use DIRECT connection, NOT the pooler!
      # ===========================================

      # REQUIRED: Direct database URL (port 5432, NOT 6543!)
      # Format: jdbc:postgresql://db.PROJECT_REF.supabase.co:5432/postgres
      - key: FLYWAY_URL
        sync: false  # Set manually in Render dashboard

      # REQUIRED: Direct connection username (just "postgres", NOT postgres.PROJECT_REF)
      - key: FLYWAY_USER
        value: postgres

      # Uses same password as DATABASE_PASSWORD (automatically inherited)

      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a secure secret

      - key: JWT_EXPIRATION_MS
        value: 86400000  # 24 hours

      # Spring Configuration
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: PORT
        value: 8080

      # CORS Configuration (update after deploying frontend)
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app,http://localhost:5173

# =====================================================
# Deployment Instructions
# =====================================================
#
# 1. Push this file to your GitHub repository
#
# 2. In Render Dashboard:
#    - New > Web Service
#    - Connect your GitHub repository
#    - Render will auto-detect this file
#
# 3. Add Environment Variables (from Supabase Dashboard):
#
#    For the APPLICATION (pooler connection):
#    - DATABASE_URL: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:6543/postgres?prepareThreshold=0
#    - DATABASE_USERNAME: postgres.YOUR_PROJECT_REF (with project reference!)
#    - DATABASE_PASSWORD: your database password
#
#    For FLYWAY MIGRATIONS (direct connection - REQUIRED!):
#    - FLYWAY_URL: jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres
#    - FLYWAY_USER: postgres (just "postgres", NOT postgres.PROJECT_REF)
#    - FLYWAY_PASSWORD is optional (uses DATABASE_PASSWORD if not set)
#
#    Where to find these in Supabase:
#    - Go to Project Settings > Database
#    - Connection string section shows both pooler and direct URLs
#    - YOUR_PROJECT_REF is your project reference (e.g., "abcdefghijklm")
#
# 4. Deploy!
#    - First deployment takes ~5-7 minutes
#    - Subsequent deploys are faster
#    - Free tier sleeps after 15 min inactivity
#    - Wakes automatically on first request (~30 sec)
#
# 5. Get your backend URL:
#    https://task-manager-backend.onrender.com
#
# 6. Update CORS in SecurityConfig.java:
#    Add your Vercel frontend URL to allowed origins
#
# =====================================================
