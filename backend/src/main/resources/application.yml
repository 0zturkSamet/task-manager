spring:
  application:
    name: task-manager

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: false
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # IMPORTANT for Supabase: Flyway MUST use the DIRECT database connection (port 5432)
    # NOT the connection pooler (port 6543). Set FLYWAY_URL to the direct connection:
    # Example: jdbc:postgresql://db.PROJECT_REF.supabase.co:5432/postgres
    # FLYWAY_USER should be "postgres" (not postgres.PROJECT_REF) for direct connections
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}}
    user: ${FLYWAY_USER:${DATABASE_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:postgres}}
    # Connection retry settings for reliability
    connect-retries: 3
    connect-retries-interval: 5

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    root: INFO
    com.taskmanager: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    root: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.taskmanager: INFO
