spring:
  application:
    name: task-manager

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: false
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Flyway will use main datasource by default
    # Only set FLYWAY_URL if you need a direct connection (e.g., Supabase direct: db.<ref>.supabase.co:5432)
    # If not set, Flyway uses DATABASE_URL (pooler works with prepareThreshold=0)
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}}
    user: ${FLYWAY_USER:${DATABASE_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:postgres}}

# JWT Configuration
# SECURITY: JWT_SECRET must be set via environment variable in production
# Do NOT use default values - application will fail to start without proper secret
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    root: INFO
    com.taskmanager: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

# Development-only JWT secret (NEVER use in production)
jwt:
  secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}

logging:
  level:
    root: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

# SECURITY: Disable Swagger/OpenAPI in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# SECURITY: Don't expose detailed error messages in production
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: WARN
    com.taskmanager: INFO
    org.springframework.security: WARN
